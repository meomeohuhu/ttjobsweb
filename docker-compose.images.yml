services:
  postgres:
    image: postgres:16.4
    container_name: ttjobs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ttjobs_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: ttjobs-redis
    command: >
      sh -c 'if [ -n "$${SPRING_DATA_REDIS_PASSWORD}" ];
      then redis-server --appendonly yes --requirepass "$${SPRING_DATA_REDIS_PASSWORD}";
      else redis-server --appendonly yes;
      fi'
    environment:
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
    volumes:
      - ttjobs_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${SPRING_DATA_REDIS_PASSWORD}\" ]; then redis-cli -a \"$${SPRING_DATA_REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKER_USER}/ttjobs-backend:${IMAGE_TAG:-1.0.0}
    container_name: ttjobs-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

      JWT_SECRET: ${JWT_SECRET}
      TTJOBS_AI_BASE_URL: ${TTJOBS_AI_BASE_URL:-http://ai-service:8000}
      TTJOBS_CORS_ALLOWED_ORIGINS: ${TTJOBS_CORS_ALLOWED_ORIGINS:-}
      TTJOBS_APP_BASE_URL: ${TTJOBS_APP_BASE_URL:-}
      TTJOBS_EMAIL_ENABLED: ${TTJOBS_EMAIL_ENABLED:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      TTJOBS_REALTIME_REDIS_ENABLED: "true"

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TTJOBS_EMAIL_FROM: ${TTJOBS_EMAIL_FROM:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ai-service:
    image: ${DOCKER_USER}/ttjobs-ai:${IMAGE_TAG:-1.0.0}
    container_name: ttjobs-ai
    environment:
      CATEGORY_MODEL_DIR: ${CATEGORY_MODEL_DIR:-/app/models/category-classifier}
      MATCH_CLASSIFIER_MODEL_DIR: ${MATCH_CLASSIFIER_MODEL_DIR:-/app/models/cv-jd-matcher}
      MATCHER_MODEL_DIR: ${MATCHER_MODEL_DIR:-/app/cv-job-matcher}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./ai-service/models:/app/models:ro
      - ./ai-service/cv-job-matcher:/app/cv-job-matcher:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${DOCKER_USER}/ttjobs-frontend:${IMAGE_TAG:-1.0.0}
    container_name: ttjobs-frontend
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/ttjobs.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ttjobs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - backend-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ttjobs_db:
  ttjobs_redis:

networks:
  backend-net:
    driver: bridge
