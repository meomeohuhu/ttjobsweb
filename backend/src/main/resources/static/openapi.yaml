openapi: 3.0.3
info:
  title: TTJobs Backend API
  version: "1.0.0"
  description: |
    API contract for auth, users, companies, jobs, and job applications.
    This file is static and can be imported into Swagger Editor or Postman.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Users
  - name: Companies
  - name: Jobs
  - name: Applications
  - name: Saved Jobs
  - name: Notifications
  - name: Chat
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "200":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: Validation error
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: JWT token string
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Invalid credentials
  /api/users/info:
    get:
      tags: [Users]
      summary: User test endpoint
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info test
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDTO'
    put:
      tags: [Users]
      summary: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDTO'
        "400":
          description: Validation error
  /api/users/me/password:
    put:
      tags: [Users]
      summary: Change current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "204":
          description: Password changed successfully
        "400":
          description: Validation error or incorrect current password
  /api/users/me/cv:
    get:
      tags: [Users]
      summary: Get current user's CV info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current CV info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCvDTO'
    post:
      tags: [Users]
      summary: Upload current user's CV (PDF/DOC/DOCX)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: CV uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCvDTO'
        "400":
          description: Invalid file
        "503":
          description: Cloudinary not configured
    put:
      tags: [Users]
      summary: Replace current user's CV
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: CV replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCvDTO'
    delete:
      tags: [Users]
      summary: Delete current user's CV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CV deleted
        "404":
          description: CV not found
  /api/users/me/cv-text:
    get:
      tags: [Users]
      summary: Get extracted CV text
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CV text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCvTextDTO'
    post:
      tags: [Users]
      summary: Extract CV text from uploaded CV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CV text extracted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCvTextDTO'
  /api/users/me/avatar:
    get:
      tags: [Users]
      summary: Get current user's avatar info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current avatar info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarDTO'
    post:
      tags: [Users]
      summary: Upload current user's avatar (JPG/PNG/WEBP)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarDTO'
        "400":
          description: Invalid file
        "503":
          description: Cloudinary not configured
    put:
      tags: [Users]
      summary: Replace current user's avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvatarDTO'
    delete:
      tags: [Users]
      summary: Delete current user's avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Avatar deleted
        "404":
          description: Avatar not found
  /api/admin/test:
    get:
      tags: [Users]
      summary: Admin test endpoint
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin access test
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /api/companies:
    get:
      tags: [Companies]
      summary: List companies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyDTO'
    post:
      tags: [Companies]
      summary: Create company (Recruiter/Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWriteRequest'
      responses:
        "200":
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDTO'
        "403":
          description: Forbidden
  /api/companies/{id}:
    get:
      tags: [Companies]
      summary: Get company by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDTO'
        "404":
          description: Company not found
  /api/companies/{companyId}/public-page:
    get:
      tags: [Companies]
      summary: Get public company page payload
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company page payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPublicPageDTO'
        "404":
          description: Company not found
    put:
      tags: [Companies]
      summary: Update company (Owner recruiter/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyWriteRequest'
      responses:
        "200":
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDTO'
        "403":
          description: Forbidden
    delete:
      tags: [Companies]
      summary: Delete company (Owner recruiter/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company deleted
        "403":
          description: Forbidden
  /api/companies/{companyId}/members:
    get:
      tags: [Companies]
      summary: Get company members (owner/admin member/system admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyMemberDTO'
        "403":
          description: Forbidden
    post:
      tags: [Companies]
      summary: Add member to company (owner/admin member/system admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMemberUpsertRequest'
      responses:
        "200":
          description: Company member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMemberDTO'
        "400":
          description: Invalid role or invalid user type
        "409":
          description: Duplicate member
  /api/companies/{companyId}/members/{memberId}:
    put:
      tags: [Companies]
      summary: Update company member role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMemberUpsertRequest'
      responses:
        "200":
          description: Company member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMemberDTO'
    delete:
      tags: [Companies]
      summary: Remove company member
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: memberId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company member removed
        "400":
          description: Owner cannot be removed or last admin cannot be removed
  /api/jobs:
    get:
      tags: [Jobs]
      summary: Get candidate-facing jobs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
    post:
      tags: [Jobs]
      summary: Create job (Recruiter/Admin with company ownership)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWriteRequest'
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDTO'
        "403":
          description: Forbidden
  /api/jobs/highlights:
    get:
      tags: [Jobs]
      summary: Get highlighted public jobs
      parameters:
        - in: query
          name: type
          schema:
            type: string
            default: high_salary
            enum: [high_salary]
        - in: query
          name: size
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Highlighted job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
        "400":
          description: Invalid highlight type
  /api/jobs/best:
    get:
      tags: [Jobs]
      summary: Get best public jobs
      parameters:
        - in: query
          name: type
          schema:
            type: string
            default: most_saved
            enum: [most_saved]
        - in: query
          name: size
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Best job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
        "400":
          description: Invalid best job type
  /api/jobs/categories/top:
    get:
      tags: [Jobs]
      summary: Get top job categories
      parameters:
        - in: query
          name: size
          schema:
            type: integer
            default: 8
            minimum: 1
            maximum: 24
      responses:
        "200":
          description: Top job category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobCategoryStatDTO'
  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDTO'
        "404":
          description: Job not found
    put:
      tags: [Jobs]
      summary: Update job (Owner recruiter/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWriteRequest'
      responses:
        "200":
          description: Job updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDTO'
        "403":
          description: Forbidden
    delete:
      tags: [Jobs]
      summary: Archive job (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Archived successfully
  /api/jobs/{id}/close:
    put:
      tags: [Jobs]
      summary: Close job
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Closed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDTO'
  /api/jobs/company/{companyId}:
    get:
      tags: [Jobs]
      summary: Get jobs of one company (owner recruiter/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Company jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
        "403":
          description: Forbidden
  /api/jobs/search:
    get:
      tags: [Jobs]
      summary: Search jobs with filters and pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: title
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: companyName
          schema:
            type: string
        - in: query
          name: salaryMin
          schema:
            type: number
            format: double
        - in: query
          name: salaryMax
          schema:
            type: number
            format: double
        - in: query
          name: jobType
          schema:
            type: string
        - in: query
          name: experienceLevel
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            example: open
        - in: query
          name: skills
          description: Repeated query params, e.g. skills=Java&skills=Spring
          schema:
            type: array
            items:
              type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
  /api/applications:
    get:
      tags: [Applications]
      summary: Get all applications (Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationDTO'
        "403":
          description: Forbidden
  /api/applications/user/{userId}:
    get:
      tags: [Applications]
      summary: Get applications by user (self/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationDTO'
  /api/applications/job/{jobId}:
    get:
      tags: [Applications]
      summary: Get applications by job (owner recruiter/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Job applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationDTO'
  /api/applications/recruiter/my-jobs:
    get:
      tags: [Applications]
      summary: Get applications for jobs owned by current recruiter
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recruiter applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplicationDTO'
        "403":
          description: Forbidden
  /api/applications/apply:
    post:
      tags: [Applications]
      summary: Apply for a job (Candidate for self only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationDTO'
        "400":
          description: Invalid apply condition
        "403":
          description: Forbidden
        "409":
          description: Duplicate application
  /api/applications/{applicationId}/status:
    put:
      tags: [Applications]
      summary: Update application status (Recruiter owner/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: status
          required: true
          schema:
            type: string
            example: reviewing
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationDTO'
        "400":
          description: Invalid transition
        "403":
          description: Forbidden
  /api/applications/{applicationId}/withdraw:
    put:
      tags: [Applications]
      summary: Withdraw application (owner candidate only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Withdraw success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplicationDTO'
        "400":
          description: Invalid terminal transition
        "403":
          description: Forbidden
  /api/applications/{applicationId}:
    delete:
      tags: [Applications]
      summary: Legacy withdraw endpoint (soft withdraw)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Withdraw success
  /api/applications/{applicationId}/timeline:
    get:
      tags: [Applications]
      summary: Get application status timeline (owner candidate/Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Timeline list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationTimelineDTO'
  /api/saved-jobs:
    get:
      tags: [Saved Jobs]
      summary: Get my saved jobs (Candidate)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved jobs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedJobDTO'
        "403":
          description: Forbidden
  /api/saved-jobs/{jobId}:
    post:
      tags: [Saved Jobs]
      summary: Save a job (Candidate)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedJobDTO'
        "404":
          description: Job not found
        "409":
          description: Job already saved
    delete:
      tags: [Saved Jobs]
      summary: Remove saved job (Candidate)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Removed successfully
        "404":
          description: Saved job not found
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get my notifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDTO'
  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notifications count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
                    format: int64
  /api/notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      summary: Mark one notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Marked as read
        "404":
          description: Notification not found
  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
  /api/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceDTO'
    put:
      tags: [Notifications]
      summary: Update notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceRequest'
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceDTO'
  /api/recommendations/cv:
    post:
      tags: [Jobs]
      summary: Recommend jobs based on uploaded CV text (Candidate)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recommended jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
  /api/recommendations/cv-text:
    post:
      tags: [Jobs]
      summary: Recommend jobs based on provided CV text (Candidate)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPredictionRequest'
      responses:
        "200":
          description: Recommended jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobDTO'
  /api/conversations:
    post:
      tags: [Chat]
      summary: Create a conversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        "200":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDTO'
    get:
      tags: [Chat]
      summary: Get my conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationDTO'
  /api/conversations/{conversationId}/messages:
    post:
      tags: [Chat]
      summary: Send a message
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
    get:
      tags: [Chat]
      summary: Get messages in a conversation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageDTO'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Thinh
        email:
          type: string
          format: email
          example: test1@gmail.com
        password:
          type: string
          minLength: 6
          example: "123456"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [CANDIDATE, RECRUITER, ADMIN]
        phone:
          type: string
        address:
          type: string
        experienceYears:
          type: integer
        cvUrl:
          type: string
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCvDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        cvUrl:
          type: string
    UserCvTextDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        cvText:
          type: string
    UserProfileDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CANDIDATE, RECRUITER, ADMIN]
        phone:
          type: string
        address:
          type: string
        experienceYears:
          type: integer
        cvUrl:
          type: string
        avatarUrl:
          type: string
        skills:
          type: array
          items:
            type: string
    UpdateMyProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
        experienceYears:
          type: integer
          minimum: 0
        skills:
          type: array
          items:
            type: string
            maxLength: 64
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
        confirmPassword:
          type: string
    UserAvatarDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        avatarUrl:
          type: string
    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        location:
          type: string
        website:
          type: string
        industry:
          type: string
        logoUrl:
          type: string
        jobCount:
          type: integer
          format: int64
        savedJobCount:
          type: integer
          format: int64
    CompanyPublicPageDTO:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/CompanyDTO'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobDTO'
    CompanyWriteRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          type: string
        website:
          type: string
        industry:
          type: string
        logoUrl:
          type: string
    CompanyMemberDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userName:
          type: string
        userEmail:
          type: string
        memberRole:
          type: string
          enum: [RECRUITER, ADMIN]
        createdAt:
          type: string
          format: date-time
    CompanyMemberUpsertRequest:
      type: object
      required: [userId, memberRole]
      properties:
        userId:
          type: integer
          format: int64
        memberRole:
          type: string
          enum: [RECRUITER, ADMIN]
    JobDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        location:
          type: string
        salary:
          type: number
          format: double
        salaryMin:
          type: number
          format: double
        salaryMax:
          type: number
          format: double
        currency:
          type: string
          example: VND
        jobType:
          type: string
        experienceLevel:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [draft, open, closed, archived]
        postedDate:
          type: string
          format: date-time
        applicationDeadline:
          type: string
          format: date-time
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        companyLogoUrl:
          type: string
        savedCount:
          type: integer
          format: int64
    JobCategoryStatDTO:
      type: object
      properties:
        category:
          type: string
          example: INFORMATION-TECHNOLOGY
        label:
          type: string
          example: Công nghệ Thông tin
        jobCount:
          type: integer
          format: int64
    JobWriteRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        location:
          type: string
        salary:
          type: number
          format: double
        salaryMin:
          type: number
          format: double
        salaryMax:
          type: number
          format: double
        currency:
          type: string
          example: VND
        jobType:
          type: string
        experienceLevel:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [draft, open, closed, archived]
        applicationDeadline:
          type: string
          format: date-time
        company:
          type: object
          properties:
            id:
              type: integer
              format: int64
    JobApplicationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        applicationDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [submitted, reviewing, shortlisted, interviewed, offered, hired, rejected, withdrawn]
        userId:
          type: integer
          format: int64
        userName:
          type: string
        jobId:
          type: integer
          format: int64
        jobTitle:
          type: string
        companyName:
          type: string
    SavedJobDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        jobTitle:
          type: string
        companyName:
          type: string
        jobLocation:
          type: string
        jobStatus:
          type: string
        savedAt:
          type: string
          format: date-time
        note:
          type: string
        tag:
          type: string
    NotificationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        type:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationPreferenceDTO:
      type: object
      properties:
        inAppEnabled:
          type: boolean
        emailEnabled:
          type: boolean
    NotificationPreferenceRequest:
      type: object
      properties:
        inAppEnabled:
          type: boolean
        emailEnabled:
          type: boolean
    ApplicationTimelineDTO:
      type: object
      properties:
        fromStatus:
          type: string
        toStatus:
          type: string
        changedAt:
          type: string
          format: date-time
    AiPredictionRequest:
      type: object
      properties:
        cvText:
          type: string
    ConversationDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        memberIds:
          type: array
          items:
            type: integer
            format: int64
    CreateConversationRequest:
      type: object
      required: [memberIds]
      properties:
        memberIds:
          type: array
          items:
            type: integer
            format: int64
    MessageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        content:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        type:
          type: string
