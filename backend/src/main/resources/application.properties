spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/ttjobs
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Swagger UI uses the static OpenAPI spec.
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=true

# Actuator health endpoint for monitoring/deploy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# AI recommendation service (Docker).
ttjobs.ai.base-url=http://ai-service:8000

