spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties,optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:ttjobs}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:admin}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-32chars}

# Swagger UI uses the static OpenAPI spec.
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=true

# Actuator health endpoint for monitoring/deploy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# AI recommendation service (Docker).
ttjobs.ai.base-url=${TTJOBS_AI_BASE_URL:http://localhost:8000}
ttjobs.cors.allowed-origins=${TTJOBS_CORS_ALLOWED_ORIGINS:}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
ttjobs.realtime.redis.enabled=${TTJOBS_REALTIME_REDIS_ENABLED:false}
ttjobs.realtime.redis.channel=${TTJOBS_REALTIME_REDIS_CHANNEL:ttjobs:realtime}

# Email notifications. Keep disabled by default; enable via env after SMTP is configured.
ttjobs.email.enabled=${TTJOBS_EMAIL_ENABLED:false}
ttjobs.email.from=${TTJOBS_EMAIL_FROM:no-reply@ttjobs.local}
ttjobs.app.base-url=${TTJOBS_APP_BASE_URL:http://localhost:5173}
ttjobs.job-alert.enabled=${TTJOBS_JOB_ALERT_ENABLED:true}
ttjobs.job-alert.cron=${TTJOBS_JOB_ALERT_CRON:0 0 8 * * *}
ttjobs.job-alert.lookback-hours=${TTJOBS_JOB_ALERT_LOOKBACK_HOURS:24}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
