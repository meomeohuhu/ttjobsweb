spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ttjobs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Swagger UI uses the static OpenAPI spec.
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.enabled=true

# Actuator health endpoint for monitoring/deploy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# AI recommendation service (Docker).
ttjobs.ai.base-url=${TTJOBS_AI_BASE_URL:http://ai-service:8000}

# Email notifications (enable in application-secret.properties for production).
ttjobs.email.enabled=${TTJOBS_EMAIL_ENABLED:false}
ttjobs.email.from=${TTJOBS_EMAIL_FROM:no-reply@ttjobs.local}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}